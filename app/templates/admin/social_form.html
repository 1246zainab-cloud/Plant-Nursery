{% extends "admin/base.html" %}
{% block page_title %}{% if link %}Edit Social Link{% else %}Add Social Link{% endif %}{% endblock %}

{% block content %}
<div class="panel">
    <div class="panel-head">
        <div><h2>{% if link %}Edit Social Link{% else %}Add Social Link{% endif %}</h2><span class="sub">Social media profile</span></div>
    </div>
    <form method="post" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Platform *</label>
            <input type="text" name="platform" class="form-control" value="{{ link.platform if link else '' }}" placeholder="Facebook" required>
        </div>
        <div class="form-group">
            <label>URL *</label>
            <input type="text" name="url" class="form-control" value="{{ link.url if link else '' }}" placeholder="https://..." required>
        </div>
        <div class="form-group">
            <label>Display Order</label>
            <input type="number" name="display_order" class="form-control" value="{{ link.display_order if link else 0 }}">
        </div>
        <div class="form-group">
            <label class="checkbox"><input type="checkbox" name="is_active" {% if not link or link.is_active %}checked{% endif %}> Active</label>
        </div>
        <div class="form-group" style="grid-column:1/-1;display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Save</button>
            <a href="{{ url_for('admin.social_links') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
