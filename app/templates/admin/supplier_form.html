{% extends "admin/base.html" %}
{% block page_title %}{% if supplier %}Edit Supplier{% else %}Add Supplier{% endif %}{% endblock %}

{% block content %}
<div class="panel">
    <div class="panel-head">
        <div><h2>{% if supplier %}Edit Supplier{% else %}Add Supplier{% endif %}</h2><span class="sub">Supplier details</span></div>
    </div>
    <form method="post" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" class="form-control" value="{{ supplier.name if supplier else '' }}" required>
        </div>
        <div class="form-group">
            <label>Contact Person</label>
            <input type="text" name="contact_person" class="form-control" value="{{ supplier.contact_person if supplier else '' }}">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ supplier.phone if supplier else '' }}">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ supplier.email if supplier else '' }}">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
            <label>Address</label>
            <textarea name="address" class="form-control" rows="2">{{ supplier.address if supplier else '' }}</textarea>
        </div>
        <div class="form-group" style="grid-column:1/-1;">
            <label>Supplied Products</label>
            <input type="text" name="supplied_products" class="form-control" value="{{ supplier.supplied_products if supplier else '' }}" placeholder="e.g. Indoor plants, pots, soil">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
            <label>Notes</label>
            <textarea name="notes" class="form-control" rows="2">{{ supplier.notes if supplier else '' }}</textarea>
        </div>
        <div class="form-group">
            <label class="checkbox"><input type="checkbox" name="is_active" {% if not supplier or supplier.is_active %}checked{% endif %}> Active</label>
        </div>
        <div class="form-group" style="grid-column:1/-1;display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Save</button>
            <a href="{{ url_for('admin.suppliers') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
