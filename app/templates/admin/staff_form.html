{% extends "admin/base.html" %}
{% block page_title %}{% if staff_member %}Edit Staff{% else %}Add Staff{% endif %}{% endblock %}

{% block content %}
<div class="panel">
    <div class="panel-head">
        <div><h2>{% if staff_member %}Edit Staff{% else %}Add Staff{% endif %}</h2><span class="sub">Staff account & permissions</span></div>
    </div>
    <form method="post" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Username *</label>
            <input type="text" name="username" class="form-control" value="{{ staff_member.username if staff_member else '' }}" required>
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" name="email" class="form-control" value="{{ staff_member.email if staff_member else '' }}" required>
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" class="form-control" value="{{ staff_member.full_name if staff_member else '' }}">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ staff_member.phone if staff_member else '' }}">
        </div>
        <div class="form-group">
            <label>Role</label>
            <input type="text" name="role" class="form-control" value="{{ staff_member.role if staff_member else 'Staff' }}">
        </div>
        <div class="form-group">
            <label>Permissions</label>
            <input type="text" name="permissions" class="form-control" value="{{ staff_member.permissions if staff_member else '' }}" placeholder="e.g. plants,orders,inventory">
        </div>
        <div class="form-group">
            <label>{% if staff_member %}New Password{% else %}Password *{% endif %}</label>
            <input type="password" name="password" class="form-control" {% if not staff_member %}required{% endif %} placeholder="{% if staff_member %}Leave blank to keep{% else %}Min 6 chars{% endif %}">
        </div>
        <div class="form-group">
            <label class="checkbox"><input type="checkbox" name="is_active" {% if not staff_member or staff_member.is_active %}checked{% endif %}> Active</label>
        </div>
        <div class="form-group" style="grid-column:1/-1;display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Save</button>
            <a href="{{ url_for('admin.staff') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
