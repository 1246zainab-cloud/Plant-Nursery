{% extends "admin/base.html" %}
{% block page_title %}New Notification{% endblock %}

{% block content %}
<div class="panel">
    <div class="panel-head">
        <div><h2>Send Notification</h2><span class="sub">Broadcast to users</span></div>
    </div>
    <form method="post" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group" style="grid-column:1/-1;">
            <label>Title *</label>
            <input type="text" name="title" class="form-control" required>
        </div>
        <div class="form-group" style="grid-column:1/-1;">
            <label>Message</label>
            <textarea name="message" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Target</label>
            <select name="target" class="form-control">
                <option value="all">All (Customers + Admins)</option>
                <option value="customers">Customers Only</option>
                <option value="admins">Admins Only</option>
            </select>
        </div>
        <div class="form-group">
            <label>Link (optional)</label>
            <input type="text" name="link" class="form-control" placeholder="/admin/dashboard">
        </div>
        <div class="form-group" style="grid-column:1/-1;display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Send</button>
            <a href="{{ url_for('admin.notifications') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
