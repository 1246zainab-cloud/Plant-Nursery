{% extends "base.html" %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to your customer account</p>

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" name="identifier" class="form-control" required placeholder="Enter username or email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
        </form>

        <div class="form-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </div>

        <div class="admin-login-link">
            <a href="{{ url_for('auth.admin_login') }}"><i class="fa-solid fa-lock"></i> Staff / Admin Login</a>
        </div>
    </div>
</div>
{% endblock %}
