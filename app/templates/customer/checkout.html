{% extends "base.html" %}

{% block content %}
<div class="container" style="margin-top:40px;margin-bottom:60px;">
    <h1 style="color:var(--green);margin-bottom:24px;"><i class="fa-solid fa-credit-card"></i> Checkout</h1>

    <div style="display:grid;grid-template-columns:1fr 340px;gap:30px;align-items:start;">
        <div>
            <div class="auth-card" style="max-width:none;box-shadow:var(--shadow);">
                <h3 style="color:var(--green);margin-bottom:16px;">Shipping Details</h3>
                <form method="post" id="checkoutForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" class="form-control" value="{{ current_user.full_name or current_user.username }}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" class="form-control" value="{{ current_user.email }}" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Shipping Address</label>
                        <textarea name="shipping_address" class="form-control" required placeholder="Enter your full address">{{ current_user.address or '' }}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Contact Phone</label>
                        <input type="text" name="contact_phone" class="form-control" value="{{ current_user.phone or '' }}" required>
                    </div>
                    <div class="form-group">
                        <label>Order Notes (optional)</label>
                        <textarea name="notes" class="form-control" placeholder="Any special instructions"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select name="payment_method" class="form-control" required>
                            <option value="Cash on Delivery" selected>Cash on Delivery</option>
                            <option value="Credit / Debit Card">Credit / Debit Card</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="EasyPaisa">EasyPaisa</option>
                            <option value="JazzCash">JazzCash</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-check"></i> Place Order</button>
                </form>
            </div>
        </div>

        <div class="cart-summary">
            <h3 style="color:var(--green);margin-bottom:16px;">Order Summary</h3>
            {% for item in items %}
            <div class="row"><span>{{ item.plant.name }} × {{ item.quantity }}</span><span>{{ item.line_total|currency }}</span></div>
            {% endfor %}
            <div class="row total"><span>Total</span><span>{{ total|currency }}</span></div>
        </div>
    </div>
</div>

<style>
@media(max-width:768px){.container>div[style*="grid-template-columns"]{grid-template-columns:1fr!important;}}
</style>
{% endblock %}
