{% extends "base.html" %}

{% block content %}
<div class="auth-wrap" style="min-height:auto;">
    <div class="auth-card" style="max-width:560px;">
        <h2>Edit Profile</h2>
        <p class="subtitle">Update your personal information</p>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name or '' }}">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" class="form-control" value="{{ current_user.address or '' }}">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" name="city" class="form-control" value="{{ current_user.city or '' }}">
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" name="state" class="form-control" value="{{ current_user.state or '' }}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Zip Code</label>
                    <input type="text" name="zip_code" class="form-control" value="{{ current_user.zip_code or '' }}">
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <input type="text" name="country" class="form-control" value="{{ current_user.country or '' }}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-save"></i> Save Changes</button>
            <a href="{{ url_for('customer.profile') }}" class="btn btn-ghost btn-block">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
