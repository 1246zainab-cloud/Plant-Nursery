{% extends "base.html" %}

{% block content %}
<div class="auth-wrap" style="min-height:auto;">
    <div class="auth-card" style="max-width:480px;">
        <h2>Change Password</h2>
        <p class="subtitle">Keep your account secure</p>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-key"></i> Update Password</button>
            <a href="{{ url_for('customer.profile') }}" class="btn btn-ghost btn-block">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
