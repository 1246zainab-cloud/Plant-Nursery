{% extends "base.html" %}

{% block content %}
<div class="container" style="margin-top:40px;margin-bottom:60px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
        <h1 style="color:var(--green);"><i class="fa-solid fa-bell"></i> Notifications</h1>
        <button class="btn btn-outline btn-sm" onclick="markAllRead()"><i class="fa-solid fa-check-double"></i> Mark all as read</button>
    </div>

    {% if notifications %}
    <div class="notif-list">
        {% for n in notifications %}
        <div class="notif-item {% if not n.is_read %}unread{% endif %}">
            <div class="icon"><i class="fa-solid fa-circle-info"></i></div>
            <div style="flex:1;">
                <h4>{{ n.title }}</h4>
                <p>{{ n.message }}</p>
                <div class="time">{{ n.created_at|datetime }}</div>
                {% if n.link %}<a href="{{ n.link }}" class="btn btn-outline btn-sm" style="margin-top:8px;">View</a>{% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="empty-state"><i class="fa-solid fa-bell-slash"></i><h3>No notifications yet</h3></div>
    {% endif %}
</div>

<script>
function getCsrfToken() {
    const meta = document.querySelector('meta[name="csrf-token"]');
    return meta ? meta.getAttribute('content') : '';
}
function markAllRead() {
    fetch('/notifications/mark-read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'csrf_token=' + encodeURIComponent(getCsrfToken())
    }).then(function(){ location.reload(); });
}
</script>
{% endblock %}
